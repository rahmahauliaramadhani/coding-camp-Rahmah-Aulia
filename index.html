<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Budget Visualizer</h1>
            <button id="theme-toggle" class="btn-secondary">🌓 Toggle Theme</button>
        </header>

        <section class="balance-card">
            <h2>Total Balance</h2>
            <p id="total-balance">Rp 0</p>
        </section>

        <div id="limit-alert" class="alert hidden">⚠️ Warning: You have exceeded your spending limit!</div>

        <section class="card">
            <h3>Settings</h3>
            <div class="settings-grid">
                <div>
                    <label for="budget-limit">Set Spending Limit (Rp)</label>
                    <input type="number" id="budget-limit" placeholder="e.g. 1000000">
                </div>
                <div>
                    <label for="new-category">Add Custom Category</label>
                    <div class="flex-row">
                        <input type="text" id="new-category" placeholder="e.g. Health">
                        <button id="add-category-btn" class="btn-primary">Add</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card chart-container">
            <h3>Spending Distribution</h3>
            <canvas id="expense-chart"></canvas>
        </section>

        <section class="card">
            <h3>Add New Transaction</h3>
            <form id="transaction-form">
                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input type="text" id="item-name" required placeholder="e.g. Chicken Rice">
                </div>
                <div class="form-group">
                    <label for="amount">Amount (Rp)</label>
                    <input type="number" id="amount" required placeholder="e.g. 25000">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <h3>Transaction History</h3>
                <select id="sort-filter">
                    <option value="latest">Latest</option>
                    <option value="amount-high">Amount: High to Low</option>
                    <option value="amount-low">Amount: Low to High</option>
                    <option value="category">Category</option>
                </select>
            </div>
            <div class="scrollable-list">
                <ul id="transaction-list"></ul>
            </div>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
